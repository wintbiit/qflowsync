apiVersion: v1
kind: ConfigMap
metadata:
  name: qflowsync-config
  namespace: default
data:
  config.yaml: |
    qflow:
      app_id: app_id
      view_id: view_id
      cookies: cookies
    lark:
      app_id: app_id
      app_secret: app_secret
      app_token: app_token
      table_id: table_id
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qflowsync
  namespace: default
spec:
  schedule: "*/5 * * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: qflowsync
              image: ghcr.io/wintbiit/qflowsync:latest
              env:
                - name: TZ
                  value: "Asia/Shanghai"
              volumeMounts:
                - name: config-volume
                  mountPath: /app/config.yaml
                  subPath: config.yaml
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
          restartPolicy: OnFailure
          volumes:
            - name: config-volume
              configMap:
                name: qflowsync-config